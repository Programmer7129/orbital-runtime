[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-runtime"
version = "0.1.0"
description = "Radiation fault-tolerance runtime for COTS GPUs in orbit: calibrated fault injection, detection, checkpoint/recovery for PyTorch workloads."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
orbital-run = "orbital_runtime.run:main"

[tool.setuptools.packages.find]
include = ["orbital_runtime*", "demo*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# DCP emits a DEBUG record per tensor per save; on a failure that buries the
# actual assertion under thousands of lines of checkpoint logging.
log_cli_level = "WARNING"
filterwarnings = [
    # DCP announces that torch.distributed is uninitialised on every save.
    # Single-process is the intended mode here (PLAN.md: no distributed).
    "ignore:torch.distributed is disabled:UserWarning",
    "ignore:Detected an existing checkpoint:UserWarning",
]
